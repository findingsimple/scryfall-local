[project]
name = "scryfall-local"
version = "0.1.0"
description = "Local MCP server for Scryfall Magic: The Gathering card data"
readme = "README.md"
# Design: No upper bound on Python version. Upper bounds cause more problems than
# they solve - they prevent users from using newer Python versions that are almost
# always backwards compatible, and create unnecessary dependency conflicts.
requires-python = ">=3.11"
authors = [
    { name = "findingsimple" }
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "ijson>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["scryfall_local"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SIM117: nested `with tempfile...: with Store/Server...:` is the test
# suite's established idiom (~70 sites); combining adds churn, not clarity.
# E501: long lines in tests are mostly card data and descriptive test names.
"tests/*" = ["SIM117", "E501"]
